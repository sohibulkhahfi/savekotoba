<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Vocabulary Manager</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <header>
            <h1>Minna no Nihonggo</h1>
        </header>

        <nav>
            <button onclick="showMenu('flashcards')">Vocabulary</button>
            <button onclick="showMenu('game')">Quiz</button>
        </nav>
    </div>

    <div class="content">
        <div id="flashcards" class="hidden">
            <h2>Vocabulary</h2>
            <div id="flashcardContainer"></div>
        </div>

        <div id="game" class="hidden">
            <div>
                <select id="babSelector"></select>
                <button id="lihatDaftarBtn">📋 Lihat Daftar</button>
            </div>
            <div style="margin: 10px 0; text-align: left;">
                <label style="cursor: pointer; font-weight: bold;">
                <input type="checkbox" id="quizHiraganaToggle" checked> Tampilkan hiragana pada soal
                </label>
            </div>
            <div id="progress"></div>
            <div id="questionCard">Loading...</div>
            <div class="choices" id="choicesContainer"></div>
            <button id="nextBtn">Selanjutnya</button>

            <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background-color: rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
                <div class="modal-content">
                    <span class="close-button" onclick="document.getElementById('modal').style.display='none'">&times;</span>
                    <h2>Daftar Kanji - <span id="modalBabTitle"></span></h2>
                    <ul id="modalList" style="text-align:left; line-height: 2;"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="kosakata.js"></script>
    <script src="script.js"></script>
</body>
</html>
